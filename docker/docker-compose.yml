version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: personal_economy_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: personal_economy
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: personal_economy_backend
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: personal_economy
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-0}
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: personal_economy_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
